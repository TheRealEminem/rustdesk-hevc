name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity
# (workflow runs don't count, commits do). Make a small commit when the last
# one is over 30 days old, and make sure the build workflow is still enabled.
on:
  schedule:
    - cron: "43 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit if the repo has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit is $age_days days old"
          if [ "$age_days" -ge 30 ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive: repo activity to stop scheduled workflows being disabled"
            git push
          fi

      - name: Make sure the build workflow is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml -R "$GITHUB_REPOSITORY"
